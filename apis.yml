- aid: permit-io:permit-io-resources-api
  name: Permit.io Resources API
  description: >-
    Resources are *types* of objects or feature names that you wish to protect (or gate) with permissions.


    For example, if you build a document-sharing app like google docs, you might want to define a "document"
    resource.


    A resource definition block typically contains **actions**.

    Actions are the various ways you can interact with the object / feature. Each (resource, action) pair
    defines a unique permission level.


    A resource may also contain:

    - roles (if you wish to define resource-bound roles or if your permissions model is relational)

    - relations to other resources (if your permissions model is relational, i.e: you work with a ReBAC
    model)

    - attributes (attributes that are typically defined on the resource, typically used in ABAC models)
  humanURL: https://docs.permit.io/
  baseURL: https://api.permit.io
  tags:
